name: Diag FastF1 Network
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Probe FastF1 from runner
        run: |
          uv run python -c "
          import fastf1, logging, sys, os
          os.makedirs('/tmp/fastf1_diag_cache', exist_ok=True)
          logging.basicConfig(level=logging.DEBUG, stream=sys.stdout)
          print('fastf1 version', fastf1.__version__)
          fastf1.Cache.enable_cache('/tmp/fastf1_diag_cache')
          try:
              sched = fastf1.get_event_schedule(2025, include_testing=False)
              print('SCHEDULE OK rows=', len(sched))
          except Exception as e:
              print('SCHEDULE FAIL', type(e).__name__, repr(e)[:300])
          s = fastf1.get_session(2025, 'Australian', 'FP1')
          try:
              s.load(telemetry=True, weather=True, messages=True)
              print('LOAD OK laps=', len(s.laps))
          except Exception as e:
              print('LOAD FAIL', type(e).__name__, repr(e)[:500])
          "
      - name: Raw HTTP probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls = [
              "https://api.formula1.com/v1/static/2025/1/session_data.json",
              "https://livetiming.formula1.com/static/2025/1/2025-03-14_Practice-1/session_info.json",
              "https://api.openf1.org/v1/sessions?year=2025&meeting_key=1",
              "https://api.openf1.org/v1/laps?session_key=9480&limit=3",
              "https://api.openf1.org/v1/telemetry?session_key=9480&driver_number=1&limit=3",
              "https://api.openf1.org/v1/weather?session_key=9480&limit=3",
          ]
          for u in urls:
              try:
                  with urllib.request.urlopen(u, timeout=15) as r:
                      body = r.read(160).decode("utf-8", "replace")
                      print("OK", r.status, u[:70], "|", body[:120].replace("\n", " "))
              except urllib.error.HTTPError as e:
                  print("HTTPERR", e.code, e.reason, u[:70])
              except Exception as e:
                  print("ERR", type(e).__name__, str(e)[:120], u[:70])
          PY