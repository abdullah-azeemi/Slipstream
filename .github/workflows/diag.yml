name: Diag FastF1 Network
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Probe F1 API from runner
        run: uv run python - <<'PY'
import logging, sys
from fastf1 import _api as fastf1_api

console = logging.StreamHandler(sys.stdout)
console.setLevel(logging.DEBUG)

# FastF1 internal HTTP layer + logger
for name in ("fastf1._api", "fastf1", "req", "_api"):
    lg = logging.getLogger(name)
    lg.setLevel(logging.DEBUG)
    lg.addHandler(console)

import fastf1
print("fastf1 version", fastf1.__version__)
fastf1.Cache.enable_cache("/tmp/fastf1_diag_cache")

# 1) schedule host (worked in backfill)
try:
    sched = fastf1.get_event_schedule(2025, include_testing=False)
    print("SCHEDULE OK rows=", len(sched))
except Exception as e:
    print("SCHEDULE FAIL", type(e).__name__, repr(e))

# 2) session timing host
s = fastf1.get_session(2025, "Australian", "FP1")
try:
    s.load(telemetry=True, weather=True, messages=True)
    print("LOAD OK laps=", len(s.laps))
except Exception as e:
    print("LOAD FAIL", type(e).__name__, repr(e)[:500])
PY
      - name: Raw HTTP probe
        run: uv run python - <<'PY'
import urllib.request, urllib.error
urls = [
    "https://api.formula1.com/v1/static/2025/1/session_data.json",
    "https://livetiming.formula1.com/static/2025/1/2025-03-14_Practice-1/session_info.json",
]
for u in urls:
    try:
        with urllib.request.urlopen(u, timeout=10) as r:
            print("OK", r.status, u[:80])
    except urllib.error.HTTPError as e:
        print("HTTPERR", e.code, e.reason, u[:80])
    except Exception as e:
        print("ERR", type(e).__name__, str(e)[:120], u[:80])
PY